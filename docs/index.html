<!DOCTYPE html>
<html>

<head>
  <title>Keel Bone Study - BLE Data Logger</title>

  <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro/dist/iro.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/109/three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <style>
    * {
      font-family: 'Roboto Mono', sans-serif;
      box-sizing: border-box;
    }

    body {
      color: white;
      background: #000000;
      font-size: 14px;
      margin: 0;
      padding: 20px;
    }

    #pairButton {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 1px;
      text-align: center;
      text-decoration: none;
      margin: 8px 18px;
      height: 25px;
      width: 100px;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
    }

    .button-style {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 2px 10px;
      text-align: center;
      margin: 8px 5px;
      height: 25px;
      border-radius: 20px;
      cursor: pointer;
      outline: none;
      font-weight: bold;
    }

    .input-style {
      background-color: #222;
      border: 1px solid #d8f41d;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      width: 75px;
      height: 25px;
      outline: none;
      text-align: center;
    }

    .status {
      width: 100%;
      max-width: 960px;
      height: auto;
      background-color: #111111;
      border: 1px solid #000000;
      padding: 12px;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #bluetooth {
      font-size: 14px;
      flex-grow: 1;
      text-align: left;
      padding-left: 10px;
      color: #DAE3E3;
    }

    /* Side-by-Side Flex Split: 3D stays on Left, Dropdown Graphs stay on Right */
    .dashboard-split {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 15px;
      align-items: stretch;
    }

    .widget {
      background-color: #111111;
      border: 1px solid #000000;
      padding: 12px;
      color: #DAE3E3;
    }

    .left-side-3d {
      width: 250px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .right-side-plots {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      width: 100%;
    }

    .graph-container {
      width: 100%;
      height: 220px;
    }

    #canvasDigits {
      width: 100%;
      text-align: center;
      font-size: 10px;
      margin-top: 5px;
    }

    #canvasDigits span {
      display: inline-block;
      margin: 0 4px;
      background: rgba(255,255,255,0.1);
      padding: 2px 5px;
      border-radius: 3px;
    }

    .hidden {
      display: none !important;
    }

    #snackbar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #374146;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      z-index: 1000;
      display: none;
    }
  </style>
</head>

<body>

  <div class="status">
    <button id="pairButton">CONNECT</button>
    
    <div style="display: flex; align-items: center; gap: 4px;">
      <label style="font-size:12px;">Sample Rate:</label>
      <select id="rateSelect" class="button-style">
        <option value="5">5 Hz (0.20s)</option>
        <option value="10">10 Hz (0.10s)</option>
        <option value="20" selected>20 Hz (0.05s)</option>
        <option value="50">50 Hz (0.02s)</option>
        <option value="100">100 Hz (0.01s)</option>
        <option value="custom">Custom Hz</option>
      </select>
      <input id="customRateInput" type="number" class="input-style hidden" min="1" max="200" value="25" placeholder="Hz">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
      <label style="font-size:12px;">Active Plot View:</label>
      <select id="plotViewSelect" class="button-style" style="min-width: 150px;">
        <option value="accelerometer" selected>Accelerometer</option>
        <option value="gyroscope">Gyroscope</option>
        <option value="temperature">Temperature</option>
        <option value="force">Force Sensor</option>
      </select>
    </div>

    <div id="bluetooth">Click CONNECT to launch hardware sync pipeline...</div>
    
    <button id="exportButton" class="button-style">EXPORT CSV</button>
  </div>

  <div class="dashboard-split">
    
    <div class="widget left-side-3d">
      <span class="label">3D Rotation Matrix</span>
      <div id="canvasDigits">
        <span id="xQuaternion">x: -</span>
        <span id="yQuaternion">y: -</span>
        <span id="zQuaternion">z: -</span>
      </div>
    </div>

    <div class="widget right-side-plots">
      
      <div id="acc-plot-panel" class="plot-view-block">
        <span class="label">Accelerometer Profile Data (G)</span>
        <div id="accelerometer" class="graph-container"></div>
      </div>

      <div id="gyro-plot-panel" class="plot-view-block hidden">
        <span class="label">Gyroscope Dynamic Matrix (dps)</span>
        <div id="gyroscope" class="graph-container"></div>
      </div>

      <div id="temp-plot-panel" class="plot-view-block hidden">
        <span class="label">Core Temperature Monitor (°C)</span>
        <div id="temperature" class="graph-container"></div>
      </div>

      <div id="force-plot-panel" class="plot-view-block hidden">
        <span class="label">Force Analog Transducer (A1 Input)</span>
        <div id="forcePlot" class="graph-container"></div>
      </div>

    </div>

  </div>

  <div id="snackbar"></div>

  <script type="text/javascript">
    let db = null;
    let isConnected = false;
    let sessionStartTime = null;
    let lastSavedTimestamps = { accelerometer: 0, gyroscope: 0, temperature: 0, force: 0 };

    // Matches your original layout dictionary completely to pass browser GATT profile check
    var NiclaSenseME = {
      temperature: { uuid: '19b10000-2001-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Float32'], data: { temperature: [] } },
      humidity:    { uuid: '19b10000-3001-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Uint8'], data: { humidity: [] } },
      pressure:    { uuid: '19b10000-4001-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Float32'], data: { pressure: [] } },
      accelerometer: { uuid: '19b10000-5001-537e-4f6c-d104768a1214', properties: ['BLENotify'], structure: ['Float32', 'Float32', 'Float32'], data: { 'Ax': [], 'Ay': [], 'Az': [] } },
      gyroscope:     { uuid: '19b10000-6001-537e-4f6c-d104768a1214', properties: ['BLENotify'], structure: ['Float32', 'Float32', 'Float32'], data: { 'x': [], 'y': [], 'z': [] } },
      led: { uuid: '19b10000-8001-537e-4f6c-d104768a1214', properties: ['BLEWrite'], structure: ['Uint8', 'Uint8', 'Uint8'], data: { 'R': [], 'G': [], 'B': [] }, writeBusy: false, writeValue: null },
      quaternion:  { uuid: '19b10000-7001-537e-4f6c-d104768a1214', properties: ['BLENotify'], structure: ['Float32', 'Float32', 'Float32', 'Float32'], data: { 'x': [], 'y': [], 'z': [], 'w': [] }, writeBusy: false, writeValue: null },
      bsec:        { uuid: '19b10000-9001-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Float32'], data: { 'bsec': [] } },
      co2:         { uuid: '19b10000-9002-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Uint32'], data: { 'co2': [] } },
      gas:         { uuid: '19b10000-9003-537e-4f6c-d104768a1214', properties: ['BLERead'], structure: ['Uint32'], data: { 'gas': [] } }
    };

    const sensors = Object.keys(NiclaSenseME);
    const SERVICE_UUID = '19b10000-0000-537e-4f6c-d104768a1214';

    const pairButton = document.getElementById('pairButton');
    const BLEstatus = document.getElementById('bluetooth');

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("NiclaSenseStorageEngine", 1);
        request.onupgradeneeded = function(e) {
          let database = e.target.result;
          if (!database.objectStoreNames.contains("telemetry_logs")) {
            database.createObjectStore("telemetry_logs", { autoIncrement: true });
          }
        };
        request.onsuccess = function(e) { db = e.target.result; resolve(); };
        request.onerror = function(e) { reject(e); };
      });
    }

    // Call to Database to record data
    function commitRecordToDB(record) {
      if (!db) return;
      const tx = db.transaction(["telemetry_logs"], "readwrite");
      const store = tx.objectStore("telemetry_logs");
      store.add(record);
    }

    function msg(m) { BLEstatus.innerHTML = m; }

    function snack(m, warningLevel) {
      const el = document.getElementById("snackbar");
      el.style.display = "block";
      el.innerText = (warningLevel ? '☝️ ' : '✅ ') + m;
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function getTargetIntervalMs() {
      const rateSelect = document.getElementById('rateSelect');
      let hz = (rateSelect.value === 'custom') ? parseInt(document.getElementById('customRateInput').value) : parseInt(rateSelect.value);
      return 1000 / (hz || 20);
    }

    // Direct drop-in match to your 100% working baseline connection framework
    async function connect() {
      pairButton.style.backgroundColor = "grey";
      pairButton.style.color = 'black';
      pairButton.innerHTML = "PAIRING";
      msg('requesting device ...');

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }]
        });

        msg('connecting to device ...');
        device.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await device.gatt.connect();

        msg('getting primary service ...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        sessionStartTime = Date.now();

        for (const sensor of sensors) {
          msg('characteristic ' + sensor + "...");
          NiclaSenseME[sensor].characteristic = await service.getCharacteristic(NiclaSenseME[sensor].uuid);
          
          if (NiclaSenseME[sensor].properties.includes("BLENotify")) {
            NiclaSenseME[sensor].characteristic.addEventListener('characteristicvaluechanged', function (event) { 
              handleIncoming(NiclaSenseME[sensor], event.target.value, sensor); 
            });
            await NiclaSenseME[sensor].characteristic.startNotifications();
          }
          
          if (NiclaSenseME[sensor].properties.includes("BLERead")) {
            NiclaSenseME[sensor].polling = setInterval(function () {
              if(!isConnected) return;
              NiclaSenseME[sensor].characteristic.readValue().then(function (data) { 
                handleIncoming(NiclaSenseME[sensor], data, sensor); 
              }).catch(e => {});
            }, 500);
          }
          NiclaSenseME[sensor].rendered = false;
        }
        
        isConnected = true;
        pairButton.style.backgroundColor = 'green';
        pairButton.style.color = 'white';
        pairButton.innerHTML = "PAIRED";
        msg('Characteristics configured');
        snack('Connected.', 0);
      } catch (err) {
        console.error("GATT Critical error:", err);
        pairButton.style.backgroundColor = '#d8f41d';
        pairButton.style.color = 'black';
        pairButton.innerHTML = "CONNECT";
        msg('Connection failed or rejected');
      }
    }

    function handleIncoming(sensorObj, dataReceived, sensorName) {
      const now = Date.now();
      
      // Decimation engine filters data on the client side based on sample rates
      if (['accelerometer', 'gyroscope', 'temperature'].includes(sensorName)) {
        if (now - lastSavedTimestamps[sensorName] < getTargetIntervalMs()) return;
        lastSavedTimestamps[sensorName] = now;
      }

      const columns = Object.keys(sensorObj.data); 
      const typeMap = {
        "Uint8": { fn: DataView.prototype.getUint8, bytes: 1 },
        "Uint16": { fn: DataView.prototype.getUint16, bytes: 2 },
        "Uint32": { fn: DataView.prototype.getUint32, bytes: 4 },
        "Int16": { fn: DataView.prototype.getInt16, bytes: 2 },
        "Float32": { fn: DataView.prototype.getFloat32, bytes: 4 }
      };
      var packetPointer = 0, i = 0;
      let dbPayload = { timestamp: now, sensor: sensorName };

      sensorObj.structure.forEach(function (dataType) {
        var dataViewFn = typeMap[dataType].fn.bind(dataReceived);
        var unpackedValue = dataViewFn(packetPointer, true);
        
        sensorObj.data[columns[i]].push(unpackedValue);
        dbPayload[columns[i]] = unpackedValue;

        // Caps local application view cache matrix array context length
        if (sensorObj.data[columns[i]].length > 1500) { 
          sensorObj.data[columns[i]].shift(); 
        }
        packetPointer += typeMap[dataType].bytes;
        i++;
      });

      if (['accelerometer', 'gyroscope', 'temperature'].includes(sensorName)) {
        commitRecordToDB(dbPayload);
      }
      sensorObj.rendered = false; 
    }

    function onDisconnected(event) {
      isConnected = false;
      pairButton.style.backgroundColor = "red";
      pairButton.innerHTML = "CONNECT";
      snack("Device disconnected.", 1);
      for (const sensor of sensors) {
        if (typeof NiclaSenseME[sensor].polling !== 'undefined') clearInterval(NiclaSenseME[sensor].polling);
      }
    }

    function initGraph(sensor, targetDivId) {
      var series = Object.keys(NiclaSenseME[sensor].data);
      var format = [];
      const colorsList = ["#FF355E", "#66FF66", "#50BFE6"];
      
      series.forEach(function (item, idx) {
        format.push({ x: [], y: [], name: item, mode: 'lines', line: { width: 1.2, color: colorsList[idx % 3] } });
      });

      // Configures correct linear ranges explicitly to bypass calendar glitches
      Plotly.plot(targetDivId || sensor, format, {
        plot_bgcolor: '#111111', paper_bgcolor: '#111111',
        margin: { l: 45, r: 15, b: 25, t: 10 },
        showlegend: true, legend: { font: { color: '#fff', size: 9 } },
        yaxis: { tickfont: { color: '#fff', size: 9 }, gridcolor: '#222' },
        xaxis: { type: 'linear', range: [0, 60], tickmode: 'linear', tick0: 0, dtick: 10, tickfont: { color: '#fff', size: 9 }, gridcolor: '#222' }
      });
    }

    function initForceGraph() {
      Plotly.plot('forcePlot', [{ x: [], y: [], name: 'Raw Pin 8', mode: 'lines', line: { color: '#AAF0D1' } }], {
        plot_bgcolor: '#111111', paper_bgcolor: '#111111',
        margin: { l: 45, r: 15, b: 25, t: 10 },
        yaxis: { tickfont: { color: '#fff', size: 9 }, gridcolor: '#222' },
        xaxis: { type: 'linear', range: [0, 60], tickmode: 'linear', tick0: 0, dtick: 10, tickfont: { color: '#fff', size: 9 }, gridcolor: '#222' }
      });
    }

    // Standard Three.js Rendering Logic
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, 1, 1, 10000);
    var arduinoModel;

    function init3D() {
      var container = document.querySelector('.left-side-3d');
      var loader = new THREE.GLTFLoader();
      scene.background = new THREE.Color(0x58585A);
      renderer.setSize(180, 180);
      renderer.setPixelRatio(2);
      container.insertBefore(renderer.domElement, document.getElementById('canvasDigits'));

      loader.load('models/niclaSenseME.glb', function (gltf) {
        arduinoModel = gltf.scene;
        scene.add(arduinoModel);
        arduinoModel.rotation.x = 90 * (Math.PI/180);
        
        const light = new THREE.DirectionalLight(0xFFFFFF, 1);
        light.position.set(-20, 100, -10);
        scene.add(light);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1));

        camera.position.set(0, 25, 0);
        camera.rotation.y = Math.PI;
        camera.lookAt(new THREE.Vector3(0, 0, 0));
        renderer.render(scene, camera);
      });
    }

    Array.prototype.latest = function () { return this[this.length - 1]; };

    function graph(sensor) {
      if (!sessionStartTime) return;
      const element = NiclaSenseME[sensor];
      const columns = Object.keys(element.data);
      if(element.data[columns[0]].length === 0) return;

      let pointsCount = element.data[columns[0]].length;
      let timeline = [];
      let step = getTargetIntervalMs() / 1000;
      for(let k = 0; k < pointsCount; k++) timeline.push(k * step);

      if (timeline.length > 0 && timeline[timeline.length - 1] > 60) {
        const top = timeline[timeline.length - 1];
        Plotly.relayout(sensor, { 'xaxis.range': [top - 60, top] });
      }

      var values = [];
      columns.forEach(label => values.push(element.data[label]));
      Plotly.restyle(sensor, { x: Array(columns.length).fill(timeline), y: values });
    }

    function digit(sensor) {
      const value = NiclaSenseME[sensor].data[sensor].latest();
      const div = document.getElementById(sensor + "-value");
      if (div && !Number.isNaN(value) && value !== undefined) div.innerHTML = Math.round(value * 10) / 10;
    }

    function update3d() {
      if (!arduinoModel || !NiclaSenseME['quaternion'].data.x.length) return;
      var x = NiclaSenseME['quaternion'].data.x.latest();
      var y = NiclaSenseME['quaternion'].data.y.latest();
      var z = NiclaSenseME['quaternion'].data.z.latest();
      var w = NiclaSenseME['quaternion'].data.w.latest();

      const quaternion = new THREE.Quaternion(x, y, z, w);
      quaternion.normalize();
      arduinoModel.setRotationFromQuaternion(quaternion);
      renderer.render(scene, camera);

      var rot = new THREE.Euler().setFromQuaternion(quaternion, 'XYZ');
      document.getElementById('xQuaternion').innerHTML = "x: " + Math.round(rot.x * 180 / Math.PI + 180);
      document.getElementById('yQuaternion').innerHTML = "y: " + Math.round(rot.y * 180 / Math.PI + 180);
      document.getElementById('zQuaternion').innerHTML = "z: " + Math.round(rot.z * 180 / Math.PI + 180);
    }

    var skip_frame = false;
    function draw() {
      function updateViz(sensor, fns) {
        if (NiclaSenseME[sensor].rendered == false) { fns.forEach(fn => fn(sensor)); NiclaSenseME[sensor].rendered = true; }
      }
      if (skip_frame == false) {
        updateViz('accelerometer', [graph]);
        updateViz('gyroscope', [graph]);
        updateViz('temperature', [digit, graph]);
        updateViz('quaternion', [update3d]);
        skip_frame = true;
      } else { skip_frame = false; }
      requestAnimationFrame(draw);
    }

    // High-volume long-term asynchronous storage data builder for parsing into a clean CSV format
    function exportDatabaseToCSV() {
      if (!db) return;
      snack("Parsing long-term telemetry log array context... Please wait.", 0);
      const tx = db.transaction(["telemetry_logs"], "readonly");
      const store = tx.objectStore("telemetry_logs");
      const cursorRequest = store.openCursor();
      let csvRows = [["Timestamp_ISO", "Elapsed_Seconds", "Sensor", "X_or_Value", "Y", "Z"]];

      cursorRequest.onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          const row = cursor.value;
          const iso = new Date(row.timestamp).toISOString();
          const sec = ((row.timestamp - sessionStartTime)/1000).toFixed(3);
          if (row.sensor === 'accelerometer') csvRows.push([iso, sec, row.sensor, row.Ax, row.Ay, row.Az]);
          else if (row.sensor === 'gyroscope') csvRows.push([iso, sec, row.sensor, row.x, row.y, row.z]);
          else if (row.sensor === 'temperature') csvRows.push([iso, sec, row.sensor, row.temperature, "", ""]);
          cursor.continue();
        } else {
          let outputText = csvRows.map(r => r.join(",")).join("\n");
          const blob = new Blob([outputText], { type: 'text/csv;charset=utf-8;' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.setAttribute('download', `Telemetry_Capture_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          snack("Export compiled completely!", 0);
        }
      };
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      
      const plotViewSelect = document.getElementById('plotViewSelect');
      const panelsMap = {
        'accelerometer': 'acc-plot-panel', 'gyroscope': 'gyro-plot-panel',
        'temperature': 'temp-plot-panel', 'force': 'force-plot-panel'
      };

      plotViewSelect.addEventListener('change', (e) => {
        Object.keys(panelsMap).forEach(key => {
          const block = document.getElementById(panelsMap[key]);
          if(e.target.value === key) block.classList.remove('hidden');
          else block.classList.add('hidden');
        });
      });

      const rateSelect = document.getElementById('rateSelect');
      const customRateInput = document.getElementById('customRateInput');
      rateSelect.addEventListener('change', (e) => {
        if(e.target.value === 'custom') customRateInput.classList.remove('hidden');
        else customRateInput.classList.add('hidden');
      });

      document.getElementById('exportButton').addEventListener('click', exportDatabaseToCSV);
      if ("bluetooth" in navigator) pairButton.addEventListener('click', connect);

      initGraph('gyroscope');
      initGraph('accelerometer');
      initGraph('temperature');
      initForceGraph();
      init3D();
      requestAnimationFrame(draw);
    });
  </script>
</body>

</html>
