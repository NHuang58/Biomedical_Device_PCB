<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Arduino Nicla Sense ME - Web Data Logger</title>

  <link href='https://fonts.googleapis.com/css?family=Roboto+Mono' rel='stylesheet'>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    * {
      font-family: 'Roboto Mono', sans-serif;
    }

    body {
      color: white;
      background: #000000;
      font-size: 14px;
    }

    #pairButton {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 1px;
      text-align: center;
      text-decoration: none;
      margin: 8px 18px;
      height: 25px;
      width: 100px;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
    }

    .button-style {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 1px;
      text-align: center;
      text-decoration: none;
      margin: 8px 5px;
      height: 25px;
      width: 100px;
      border-radius: 20px;
      cursor: pointer;
      outline: none;
    }

    /* Specific style for the select and input to match buttons */
    select.button-style, input.button-style {
      padding-left: 10px;
      width: 110px;
    }

    .container {
      width: 960px;
      height: 384px;
      margin-top: 30px;
      margin-bottom: 7.5px;
      margin: 0 auto;
    }

    .widget {
      background-color: #111111;
      border: 1px solid #000000;
      border-radius: 0px;
      padding: 12px;
      margin: 6px;
      float: left;
      color: #DAE3E3;
      padding-bottom: 16px;
    }

    a {
      color: white;
      font-weight: bold;
    }

    .status {
      margin-top: 1%;
      width: 885px;
      height: 42px;
      color: white;
      display: grid;
      grid-template-columns: 15% 15% 55% 15%;
    }

    #bluetooth {
      font-size: 16px;
      height: 50%;
      margin: auto;
    }

    .square {
      width: 192px;
      height: 226px;
      position: relative;
    }

    .label {
      height: 15px;
      display: inline;
      font-size: 12px;
    }

    .statusBar {
      height: 100%;
      vertical-align: middle;
      text-align: center;
    }

    .digit {
      font-size: 20px;
      color: #888888;
      float: right;
    }

    .short {
      width: 192px;
      height: 92px;
    }

    .double {
      width: 423px;
      height: 226px;
    }

    .graph {
      width: 192px;
      height: 177px;
    }

    .doublegraph {
      width: 423px;
      height: 177px;
    }

    .shortgraph {
      width: 192px;
      height: 81px;
    }

    #snackbar {
      height: 23px;
      display: block;
      visibility: visible;
      text-align: center;
      background-color: #374146;
      border-radius: 3px;
      padding: 4px 13px 4px 13px;
      margin: 16px 7px 7px;
      display: inline-block;
    }

    #snackbar.show {
      -webkit-animation: fadein 0.5s, 0.1s;
      animation: fadein 0.5s, 0.1s;
    }

    @-webkit-keyframes fadein {
      from { visibility: hidden; opacity: 0; }
      to { visibility: visible; opacity: 1; }
    }

    @keyframes fadein {
      from { visibility: hidden; opacity: 0; }
      to { visibility: visible; opacity: 1; }
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="snackbar"></div>

    <div class="status widget">
      <button id="pairButton">CONNECT</button>

      <div style="margin:auto;">
        <select id="rateSelect" class="button-style">
          <option value="10">10 Hz</option>
          <option value="10">25 Hz</option>
          <option value="10">50 Hz</option>
          <option value="10">100 Hz</option>
          <option value="10">200 Hz</option>
          <option value="custom">Custom</option>
        </select>
        <input id="customRateInput" type="number" placeholder="ms" class="button-style hidden" />
      </div>

      <div class="label statusBar" id="bluetooth">Click the connect button to connect your device</div>

      <button id="exportButton" class="button-style">EXPORT</button>
    </div>

    <div class="double widget">
      <div class="label">&#128640; Accelerometer (IMU)</div>
      <div id="accelerometer" class="doublegraph"></div>
    </div>

    <div class="square widget">
      <div class="label">&#128171; Gyroscope</div>
      <div class="label" id="gyroscope-value"></div>
      <div id="gyroscope" class="graph"></div>
    </div>

    <div class="short widget">
      <div class="label">&#127777; Temperature - </div>
      <div class="label" id="temperature-value"></div>
      <div class="label">&deg;C</div>
      <div class="shortgraph" id="temperature"></div>
    </div>

    <div class="short widget">
      <div class="label">&#9889; Pin A1 - </div>
      <div class="label" id="analogA1-value"></div>
      <div class="label"></div>
      <div class="shortgraph" id="analogA1"></div>
    </div>

  </div>
</body>

<script type="text/javascript">
  /*
  Nicla Sense ME dashboard - reads temperature, accelerometer, gyroscope and
  pin A1 over BLE, renders them live, and persists every sample to MongoDB
  via the Flask backend in main.py. The export button pulls back everything
  MongoDB has stored under this browser session, from page load to click.
  */

  var maxRecords = 1200; // 20 Minutes of on-screen graph history

  // Default polling interval in ms (20ms = 50Hz)
  var currentPollingInterval = 20;

  // Tags every persisted reading so export can scope to "since the device
  // was paired" instead of a fixed lookback window. Regenerated on every
  // successful pairing (see connect()), so a disconnect + re-pair starts a
  // fresh export window rather than merging into the previous one.
  var sessionId = null;
  function newSessionId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2));
  }

  var NiclaSenseME =
  {
    temperature:
    {
      uuid: '19b10000-2001-537e-4f6c-d104768a1214',
      properties: ['BLERead'],
      structure: ['Float32'],
      data: { temperature: [] }
    },
    accelerometer:
    {
      uuid: '19b10000-5001-537e-4f6c-d104768a1214',
      properties: ['BLENotify'],
      structure: ['Float32', 'Float32', 'Float32'],
      data: { 'Ax': [], 'Ay': [], 'Az': [] }
    },
    gyroscope:
    {
      uuid: '19b10000-6001-537e-4f6c-d104768a1214',
      properties: ['BLENotify'],
      structure: ['Float32', 'Float32', 'Float32'],
      data: { 'x': [], 'y': [], 'z': [] }
    },
    analogA1:
    {
      uuid: '19b10000-a001-537e-4f6c-d104768a1214',
      properties: ['BLERead'],
      structure: ['Uint32'],
      data: { analogA1: [] }
    }
  }

  const sensors = Object.keys(NiclaSenseME);
  const SERVICE_UUID = '19b10000-0000-537e-4f6c-d104768a1214';
  var isConnected = false;

  var pairButton, BLEstatus, snackBar, rateSelect, customRateInput;

  function msg(m) {
    BLEstatus.innerHTML = m;
  }

  function snack(m, warningLevel) {
    snackBar.style.visibility = "visible";
    snackBar.className = "show";
    var warnEmoji = warningLevel ? '☝️  ' : '✅  ';
    setTimeout(function () { snackBar.className = snackBar.className.replace("show", ""); }, 501);
    snackBar.innerHTML = warnEmoji + m + ' <span onClick=hideSnack() style="cursor:pointer; margin-left: 15px"> ✖ </span> ';
  }

  function hideSnack() {
    snackBar.style.visibility = "hidden";
  }

  // Logic to change polling interval dynamically
  function setPollingInterval(ms) {
    currentPollingInterval = ms;
    if(!isConnected) return; // Only apply if connected, otherwise connect() will handle it

    for (const sensor of sensors) {
      if (NiclaSenseME[sensor].properties.includes("BLERead")) {
        // Clear existing interval
        if (typeof NiclaSenseME[sensor].polling !== 'undefined') {
          clearInterval(NiclaSenseME[sensor].polling);
        }
        // Set new interval
        NiclaSenseME[sensor].polling = setInterval(function () {
          NiclaSenseME[sensor].characteristic.readValue()
          .then(function (data) { handleIncoming(NiclaSenseME[sensor], data); })
          .catch(err => console.log(err)); // Catch errors if read happens during disconnect
        }, currentPollingInterval);
      }
    }
    console.log("Polling rate updated to: " + ms + "ms");
  }

  async function connect() {
    pairButton.style.backgroundColor = "grey";
    pairButton.style.color = 'black';
    pairButton.innerHTML = "PAIRING";
    msg('requesting device ...');

    try {
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      msg('connecting to device ...');
      device.addEventListener('gattserverdisconnected', onDisconnected);
      const server = await device.gatt.connect();
      isConnected = true;

      msg('getting primary service ...');
      const service = await server.getPrimaryService(SERVICE_UUID);

      for (const sensor of sensors) {
        msg('characteristic ' + sensor + "...");
        NiclaSenseME[sensor].characteristic = await service.getCharacteristic(NiclaSenseME[sensor].uuid);

        if (NiclaSenseME[sensor].properties.includes("BLENotify")) {
          NiclaSenseME[sensor].characteristic.addEventListener('characteristicvaluechanged', function (event) { handleIncoming(NiclaSenseME[sensor], event.target.value); });
          await NiclaSenseME[sensor].characteristic.startNotifications();
        }

        if (NiclaSenseME[sensor].properties.includes("BLERead")) {
          NiclaSenseME[sensor].polling = setInterval(function () {
            NiclaSenseME[sensor].characteristic.readValue().then(function (data) { handleIncoming(NiclaSenseME[sensor], data); })
          }, currentPollingInterval);
        }

        NiclaSenseME[sensor].rendered = false;
      }
      pairButton.style.backgroundColor = 'green';
      pairButton.style.color = 'white';
      pairButton.innerHTML = "PAIRED";
      msg('Characteristics configured');
      snack('Connected.', 0);

      // Pairing just completed - start a fresh export window from this instant.
      sessionId = newSessionId();
      startPersisting();
    } catch (err) {
      console.error('Connect error', err);
      pairButton.style.backgroundColor = '#d8f41d';
      pairButton.style.color = 'black';
      pairButton.innerHTML = "CONNECT";
      msg('Error during connection');
      snack('Connection failed or cancelled', 1);
      isConnected = false;
    }
  }

  function handleIncoming(sensor, dataReceived) {
    const columns = Object.keys(sensor.data);
    const typeMap = {
      "Uint8": { fn: DataView.prototype.getUint8, bytes: 1 },
      "Uint16": { fn: DataView.prototype.getUint16, bytes: 2 },
      "Uint32": { fn: DataView.prototype.getUint32, bytes: 4 },
      "Int16": { fn: DataView.prototype.getInt16, bytes: 2 },
      "Float32": { fn: DataView.prototype.getFloat32, bytes: 4 }
    };
    var packetPointer = 0, i = 0;

    sensor.structure.forEach(function (dataType) {
      var dataViewFn = typeMap[dataType].fn.bind(dataReceived);
      var unpackedValue = dataViewFn(packetPointer, true);
      sensor.data[columns[i]].push(unpackedValue);
      if (sensor.data[columns[i]].length > maxRecords) { sensor.data[columns[i]].shift(); }
      packetPointer += typeMap[dataType].bytes;
      i++;
    });
    sensor.rendered = false;
  }

  function onDisconnected(event) {
    let device = event.target;
    pairButton.style.backgroundColor = "red";
    pairButton.innerHTML = "PAIR NICLA";
    isConnected = false;

    for (const sensor of sensors) {
      if (typeof NiclaSenseME[sensor].polling !== 'undefined') {
        clearInterval(NiclaSenseME[sensor].polling);
      }
    }

    stopPersisting();

    snack('Device ' + (device && device.name ? device.name : '') + ' has been disconnected.', 1);
    msg("Disconnected");
  }

  const colors = ["#FF355E", "#FD5B20", "#FF6037", "#FF9966", "#FF9933", "#FFCC33", "#FFFF66", "#FFFF66", "#CCFF00", "#66FF66", "#AAF0D1", "#50BFE6", "#FF6EFF", "#EE34D2", "#FF00CC", "#FF00CC"];
  var colorIndex = 0;
  function initGraph(sensor) {
    var title = sensor;
    var series = Object.keys(NiclaSenseME[sensor].data);
    var format = [];
    series.forEach(function (item) {
      colorIndex++;
      if (colorIndex > colors.length) { colorIndex = 0; }
      format.push({
        y: [],
        name: item,
        mode: 'lines',
        width: 1,
        line: { width: 1, color: colors[colorIndex] }
      });
    });

    Plotly.plot(title, format, {
      plot_bgcolor: '#111111',
      paper_bgcolor: '#111111',
      margin: { l: 8, r: 8, b: 18, t: 18 },
      showlegend: false,
      yaxis: { 'showticklabels': false },
      xaxis: {
        'range': [0, maxRecords],
        'showticklabels': false,
        'autorange': false,
        'showgrid': true,
        'zeroline': true,
        tickfont: { size: 8 }
      }
    }
    );
  }

  Array.prototype.latest = function () { return this[this.length - 1]; };

  function graph(sensor) {
    var labels = Object.keys(NiclaSenseME[sensor].data);
    var values = [];
    labels.forEach(function (label) {
      values.push(NiclaSenseME[sensor].data[label]);
    });
    Plotly.restyle(sensor, { y: values });
  }

  function digit(sensor) {
    const value = NiclaSenseME[sensor].data[sensor].latest();
    const div = document.getElementById(sensor + "-value");
    if (!Number.isNaN(value)) { div.innerHTML = Math.round(value * 10) / 10; };
  }

  var skip_frame = false;
  function draw() {
    function updateViz(sensor, fns) {
      if (NiclaSenseME[sensor].rendered == false) {
        fns.forEach(function (fn) {
          fn(sensor);
        });
        NiclaSenseME[sensor].rendered = true;
      }
    }
    if (skip_frame == false) {
      updateViz('accelerometer', [graph]);
      updateViz('gyroscope', [graph]);
      updateViz('temperature', [digit, graph]);
      updateViz('analogA1', [digit, graph]);

      skip_frame = true;
    } else { skip_frame = false; }
    requestAnimationFrame(draw);
  }

  // --- MongoDB persistence -------------------------------------------------

  function latestOrNull(sensor, field) {
    const arr = NiclaSenseME[sensor] && NiclaSenseME[sensor].data[field];
    return (arr && arr.length) ? arr[arr.length - 1] : null;
  }

  var persistTimer = null;

  // Snapshot the latest values at a fixed 5Hz cadence, independent of the
  // BLE polling rate, so MongoDB writes stay bounded even at 200Hz BLE rates.
  function startPersisting() {
    if (persistTimer) clearInterval(persistTimer);
    persistTimer = setInterval(sendReadingToServer, 200);
  }

  function stopPersisting() {
    if (persistTimer) clearInterval(persistTimer);
    persistTimer = null;
  }

  async function sendReadingToServer() {
    const reading = {
      session_id: sessionId,
      timestamp: new Date().toISOString(),
      accelerometer: { x: latestOrNull('accelerometer', 'Ax'), y: latestOrNull('accelerometer', 'Ay'), z: latestOrNull('accelerometer', 'Az') },
      gyroscope: { x: latestOrNull('gyroscope', 'x'), y: latestOrNull('gyroscope', 'y'), z: latestOrNull('gyroscope', 'z') },
      temperature: latestOrNull('temperature', 'temperature'),
      analog_a1: latestOrNull('analogA1', 'analogA1')
    };

    // Nothing received yet on any channel - skip the write.
    if (reading.temperature === null && reading.analog_a1 === null &&
        reading.accelerometer.x === null && reading.gyroscope.x === null) {
      return;
    }

    try {
      await fetch('/api/readings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reading)
      });
    } catch (err) {
      console.error('Failed to persist reading to MongoDB', err);
    }
  }

  async function exportSessionData() {
    // With an active pairing, export just that session; otherwise (never
    // paired, or a connection error) fall back to exporting everything
    // MongoDB has logged so far, so the button always produces something.
    const query = sessionId ? `?session_id=${encodeURIComponent(sessionId)}` : '';
    const filename = sessionId ? `NiclaData_${sessionId}.csv` : 'NiclaData_all.csv';

    try {
      const response = await fetch(`/api/export${query}`);
      if (!response.ok) throw new Error(`Export failed (${response.status})`);

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      snack(sessionId ? 'Exported this session\'s data from MongoDB' : 'Exported all logged data from MongoDB', 0);
    } catch (err) {
      console.error(err);
      snack('Export failed: ' + err.message, 1);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    pairButton = document.getElementById('pairButton');
    BLEstatus = document.getElementById('bluetooth');
    snackBar = document.getElementById('snackbar');
    rateSelect = document.getElementById('rateSelect');
    customRateInput = document.getElementById('customRateInput');

    snack('IMPORTANT - first upload the sketch to your Arduino Nicla Sense ME', 1);

    // Dropdown change listener
    rateSelect.addEventListener('change', function(e) {
      const val = e.target.value;
      if (val === 'custom') {
        rateSelect.style.display = 'none';
        customRateInput.classList.remove('hidden');
        customRateInput.focus();
      } else {
        setPollingInterval(parseInt(val));
      }
    });

    // Custom Input listener (Enter key or blur)
    function handleCustomInput() {
      const val = parseInt(customRateInput.value);
      if (val > 0) {
        setPollingInterval(val);
        rateSelect.value = 'custom';
        rateSelect.style.display = 'inline-block';
        customRateInput.classList.add('hidden');
        snack(`Polling rate set to ${val}ms`, 0);
      }
    }

    customRateInput.addEventListener('blur', function() {
       if(customRateInput.value === "") {
         customRateInput.classList.add('hidden');
         rateSelect.style.display = 'inline-block';
         rateSelect.value = "20"; // Default back to 50hz
       } else {
         handleCustomInput();
       }
    });

    customRateInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        handleCustomInput();
      }
    });

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    if (isIOS() && !navigator.bluetooth) {
      snack("Web Bluetooth on iPad requires specific setup.", 1);
    }

    if (navigator.bluetooth && typeof navigator.bluetooth.requestDevice === "function") {
      pairButton.addEventListener('click', function (event) {
        connect();
      });
    } else {
      msg("browser not supported");
      snack("Error: This browser doesn't support Web Bluetooth.", 1);
    }

    document.getElementById('exportButton').addEventListener('click', exportSessionData);

    initGraph('gyroscope');
    initGraph('accelerometer');
    initGraph('temperature');
    initGraph('analogA1');

    requestAnimationFrame(draw);
  });

</script>

</html>
